name: AI Car Rental CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  AWS_REGION: us-east-1
  NODE_VERSION: '18'

jobs:
  test:
    name: Rental App — Install & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rental-app
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: rental-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run type checking
        run: npm run type-check

      - name: Run linter
        run: npm run lint
        continue-on-error: true

      - name: Run tests
        run: npm run test
        continue-on-error: true

  test-portal:
    name: Portal — Build & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portal/frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: portal/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run type checking
        run: npx tsc --noEmit

      - name: Run linter
        run: npm run lint
        continue-on-error: true

      - name: Build portal
        run: npx next build

  test-camera-system:
    name: Camera System Python Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: camera-system
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Pi test dependencies
        run: |
          pip install -r pi/requirements.txt
          pip install pytest

      - name: Run Pi unit tests
        run: python -m pytest pi/tests/ -q
        env:
          PYTHONPATH: pi

      - name: Run review_api tests
        run: python -m pytest lambdas/review_api/ -q
        env:
          PYTHONPATH: lambdas/review_api

      - name: Run damage_detection tests
        run: python -m pytest lambdas/damage_detection/ -q
        env:
          PYTHONPATH: lambdas/damage_detection

      - name: Install model test dependencies
        run: |
          pip install -r model/requirements.txt
          pip install boto3

      - name: Run model tests (detect_daemon, scan_uploader, plate_reader)
        run: python -m pytest model/tests/ -q
        env:
          PYTHONPATH: model

  deploy-dev:
    name: Deploy to Development
    runs-on: ubuntu-latest
    needs: [test, test-portal, test-camera-system]
    if: github.ref == 'refs/heads/develop'
    environment: development
    defaults:
      run:
        working-directory: rental-app
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: rental-app/package-lock.json

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Cache build output
        uses: actions/cache@v4
        id: build-cache
        with:
          path: rental-app/dist/
          key: build-${{ hashFiles('rental-app/src/**/*', 'rental-app/package.json', 'rental-app/package-lock.json', 'rental-app/vite.config.ts', 'rental-app/tsconfig.json') }}

      - name: Install dependencies and build (if cache miss)
        if: steps.build-cache.outputs.cache-hit != 'true'
        run: |
          npm ci
          npm run build

      - name: Prepare Lambda dependencies (no artifacts)
        run: |
          cd infrastructure/lambda-layers/common/nodejs
          npm ci --production
          cd ../../../../
          mkdir -p infrastructure/lambda/api

      - name: Install CDK dependencies
        run: npm ci

      - name: Install CDK CLI
        run: npm install -g aws-cdk

      - name: Set CDK environment variables
        run: |
          echo "CDK_DEFAULT_ACCOUNT=$(aws sts get-caller-identity --query Account --output text)" >> $GITHUB_ENV
          echo "CDK_DEFAULT_REGION=${{ env.AWS_REGION }}" >> $GITHUB_ENV

      - name: Bootstrap CDK (if needed)
        run: |
          cd infrastructure
          if aws ssm get-parameter --name "/cdk-bootstrap/hnb659fds/version" --region $CDK_DEFAULT_REGION >/dev/null 2>&1; then
            echo "CDK already bootstrapped"
          else
            cdk bootstrap aws://$CDK_DEFAULT_ACCOUNT/$CDK_DEFAULT_REGION
          fi

      - name: Clean up stuck stacks and changesets
        run: |
          cd infrastructure
          STACK_NAME="EzCarRental-dev"
          STACK_STATUS=$(aws cloudformation describe-stacks --stack-name $STACK_NAME --region $CDK_DEFAULT_REGION --query 'Stacks[0].StackStatus' --output text 2>/dev/null || echo "DOES_NOT_EXIST")
          if [[ "$STACK_STATUS" == "ROLLBACK_COMPLETE" || "$STACK_STATUS" == "CREATE_FAILED" || "$STACK_STATUS" == "UPDATE_ROLLBACK_COMPLETE" ]]; then
            aws cloudformation delete-stack --stack-name $STACK_NAME --region $CDK_DEFAULT_REGION
            aws cloudformation wait stack-delete-complete --stack-name $STACK_NAME --region $CDK_DEFAULT_REGION || true
          fi

      - name: Deploy rental-app infrastructure
        run: |
          cd infrastructure
          cdk deploy --context environment=dev --require-approval never

      - name: Deploy camera-system infrastructure
        run: |
          cd ../camera-system/infra
          pip install -r requirements.txt 2>/dev/null || true
          npx aws-cdk@2 deploy --all --context environment=dev --require-approval never

      - name: Get stack outputs
        id: stack-outputs
        run: |
          STATIC_BUCKET=$(aws cloudformation describe-stacks --stack-name EzCarRental-dev --query 'Stacks[0].Outputs[?OutputKey==`StaticAssetsBucketName`].OutputValue' --output text)
          API_ENDPOINT=$(aws cloudformation describe-stacks --stack-name EzCarRental-dev --query 'Stacks[0].Outputs[?OutputKey==`ApiEndpoint`].OutputValue' --output text)
          echo "static_bucket=$STATIC_BUCKET" >> $GITHUB_OUTPUT
          echo "api_endpoint=$API_ENDPOINT" >> $GITHUB_OUTPUT

      - name: Deploy frontend to S3
        run: |
          aws s3 sync dist/ s3://${{ steps.stack-outputs.outputs.static_bucket }}/ --delete

      - name: Test API endpoint
        run: |
          curl -f ${{ steps.stack-outputs.outputs.api_endpoint }} || echo "API health check failed — may not have /health yet"

      - name: Notify deployment
        run: |
          echo "Development deployment completed"
          echo "API Endpoint: ${{ steps.stack-outputs.outputs.api_endpoint }}"

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [test, test-portal, test-camera-system]
    if: github.ref == 'refs/heads/main'
    environment: staging
    defaults:
      run:
        working-directory: rental-app
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: rental-app/package-lock.json

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Cache build output
        uses: actions/cache@v4
        id: build-cache
        with:
          path: rental-app/dist/
          key: build-${{ hashFiles('rental-app/src/**/*', 'rental-app/package.json', 'rental-app/package-lock.json', 'rental-app/vite.config.ts', 'rental-app/tsconfig.json') }}

      - name: Install dependencies and build (if cache miss)
        if: steps.build-cache.outputs.cache-hit != 'true'
        run: |
          npm ci
          npm run build

      - name: Prepare Lambda dependencies (no artifacts)
        run: |
          cd infrastructure/lambda-layers/common/nodejs
          npm ci --production
          cd ../../../../
          mkdir -p infrastructure/lambda/api

      - name: Install CDK dependencies
        run: npm ci

      - name: Install CDK CLI
        run: npm install -g aws-cdk

      - name: Set CDK environment variables
        run: |
          echo "CDK_DEFAULT_ACCOUNT=$(aws sts get-caller-identity --query Account --output text)" >> $GITHUB_ENV
          echo "CDK_DEFAULT_REGION=${{ env.AWS_REGION }}" >> $GITHUB_ENV

      - name: Bootstrap CDK (if needed)
        run: |
          cd infrastructure
          if aws ssm get-parameter --name "/cdk-bootstrap/hnb659fds/version" --region $CDK_DEFAULT_REGION >/dev/null 2>&1; then
            echo "CDK already bootstrapped"
          else
            cdk bootstrap aws://$CDK_DEFAULT_ACCOUNT/$CDK_DEFAULT_REGION
          fi

      - name: Clean up stuck stacks and changesets
        run: |
          cd infrastructure
          STACK_NAME="EzCarRental-staging"
          STACK_STATUS=$(aws cloudformation describe-stacks --stack-name $STACK_NAME --region $CDK_DEFAULT_REGION --query 'Stacks[0].StackStatus' --output text 2>/dev/null || echo "DOES_NOT_EXIST")
          if [[ "$STACK_STATUS" == "ROLLBACK_COMPLETE" || "$STACK_STATUS" == "CREATE_FAILED" || "$STACK_STATUS" == "UPDATE_ROLLBACK_COMPLETE" ]]; then
            aws cloudformation delete-stack --stack-name $STACK_NAME --region $CDK_DEFAULT_REGION
            aws cloudformation wait stack-delete-complete --stack-name $STACK_NAME --region $CDK_DEFAULT_REGION || true
          fi

      - name: Deploy staging infrastructure
        run: |
          cd infrastructure
          cdk deploy --context environment=staging --require-approval never

      - name: Deploy camera-system infrastructure
        run: |
          cd ../camera-system/infra
          pip install -r requirements.txt 2>/dev/null || true
          npx aws-cdk@2 deploy --all --context environment=staging --require-approval never

      - name: Get stack outputs
        id: stack-outputs
        run: |
          STATIC_BUCKET=$(aws cloudformation describe-stacks --stack-name EzCarRental-staging --query 'Stacks[0].Outputs[?OutputKey==`StaticAssetsBucketName`].OutputValue' --output text)
          API_ENDPOINT=$(aws cloudformation describe-stacks --stack-name EzCarRental-staging --query 'Stacks[0].Outputs[?OutputKey==`ApiEndpoint`].OutputValue' --output text)
          echo "static_bucket=$STATIC_BUCKET" >> $GITHUB_OUTPUT
          echo "api_endpoint=$API_ENDPOINT" >> $GITHUB_OUTPUT

      - name: Deploy frontend to S3
        run: |
          aws s3 sync dist/ s3://${{ steps.stack-outputs.outputs.static_bucket }}/ --delete

      - name: Run smoke tests
        run: |
          curl -f ${{ steps.stack-outputs.outputs.api_endpoint }} || exit 1
          curl -f ${{ steps.stack-outputs.outputs.api_endpoint }}/cars || exit 1

      - name: Notify deployment
        run: |
          echo "Staging deployment completed"
          echo "API Endpoint: ${{ steps.stack-outputs.outputs.api_endpoint }}"

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    if: github.ref == 'refs/heads/main'
    environment: production
    defaults:
      run:
        working-directory: rental-app
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: rental-app/package-lock.json

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Cache build output
        uses: actions/cache@v4
        id: build-cache
        with:
          path: rental-app/dist/
          key: build-${{ hashFiles('rental-app/src/**/*', 'rental-app/package.json', 'rental-app/package-lock.json', 'rental-app/vite.config.ts', 'rental-app/tsconfig.json') }}

      - name: Install dependencies and build (if cache miss)
        if: steps.build-cache.outputs.cache-hit != 'true'
        run: |
          npm ci
          npm run build

      - name: Prepare Lambda dependencies (no artifacts)
        run: |
          cd infrastructure/lambda-layers/common/nodejs
          npm ci --production
          cd ../../../../
          mkdir -p infrastructure/lambda/api

      - name: Install CDK dependencies
        run: npm ci

      - name: Install CDK CLI
        run: npm install -g aws-cdk

      - name: Set CDK environment variables
        run: |
          echo "CDK_DEFAULT_ACCOUNT=$(aws sts get-caller-identity --query Account --output text)" >> $GITHUB_ENV
          echo "CDK_DEFAULT_REGION=${{ env.AWS_REGION }}" >> $GITHUB_ENV

      - name: Create backup of current production frontend
        id: backup
        run: |
          TIMESTAMP=$(date +%Y%m%d%H%M%S)
          CURRENT_BUCKET=$(aws cloudformation describe-stacks --stack-name EzCarRental-production --query 'Stacks[0].Outputs[?OutputKey==`StaticAssetsBucketName`].OutputValue' --output text 2>/dev/null || echo "")
          if [ ! -z "$CURRENT_BUCKET" ]; then
            aws s3 sync s3://$CURRENT_BUCKET/ s3://$CURRENT_BUCKET/backup-$TIMESTAMP/ || echo "No previous deployment to backup"
            echo "backup_prefix=backup-$TIMESTAMP" >> $GITHUB_OUTPUT
            echo "static_bucket=$CURRENT_BUCKET" >> $GITHUB_OUTPUT
          fi

      - name: Bootstrap CDK (if needed)
        run: |
          cd infrastructure
          if aws ssm get-parameter --name "/cdk-bootstrap/hnb659fds/version" --region $CDK_DEFAULT_REGION >/dev/null 2>&1; then
            echo "CDK already bootstrapped"
          else
            cdk bootstrap aws://$CDK_DEFAULT_ACCOUNT/$CDK_DEFAULT_REGION
          fi

      - name: Clean up stuck stacks and changesets
        run: |
          cd infrastructure
          STACK_NAME="EzCarRental-production"
          STACK_STATUS=$(aws cloudformation describe-stacks --stack-name $STACK_NAME --region $CDK_DEFAULT_REGION --query 'Stacks[0].StackStatus' --output text 2>/dev/null || echo "DOES_NOT_EXIST")
          if [[ "$STACK_STATUS" == "ROLLBACK_COMPLETE" || "$STACK_STATUS" == "CREATE_FAILED" || "$STACK_STATUS" == "UPDATE_ROLLBACK_COMPLETE" ]]; then
            aws cloudformation delete-stack --stack-name $STACK_NAME --region $CDK_DEFAULT_REGION
            aws cloudformation wait stack-delete-complete --stack-name $STACK_NAME --region $CDK_DEFAULT_REGION || true
          fi

      - name: Deploy production infrastructure
        run: |
          cd infrastructure
          cdk deploy --context environment=production --require-approval never

      - name: Deploy camera-system infrastructure
        run: |
          cd ../camera-system/infra
          pip install -r requirements.txt 2>/dev/null || true
          npx aws-cdk@2 deploy --all --context environment=production --require-approval never

      - name: Get stack outputs
        id: stack-outputs
        run: |
          STATIC_BUCKET=$(aws cloudformation describe-stacks --stack-name EzCarRental-production --query 'Stacks[0].Outputs[?OutputKey==`StaticAssetsBucketName`].OutputValue' --output text)
          API_ENDPOINT=$(aws cloudformation describe-stacks --stack-name EzCarRental-production --query 'Stacks[0].Outputs[?OutputKey==`ApiEndpoint`].OutputValue' --output text)
          echo "static_bucket=$STATIC_BUCKET" >> $GITHUB_OUTPUT
          echo "api_endpoint=$API_ENDPOINT" >> $GITHUB_OUTPUT

      - name: Deploy frontend to S3
        run: |
          aws s3 sync dist/ s3://${{ steps.stack-outputs.outputs.static_bucket }}/ --delete --exclude "backup-*"

      - name: Production health check
        run: |
          curl -f ${{ steps.stack-outputs.outputs.api_endpoint }} || exit 1
          curl -f ${{ steps.stack-outputs.outputs.api_endpoint }}/cars || exit 1

      - name: Notify deployment
        run: |
          echo "Production deployment completed"
          echo "API Endpoint: ${{ steps.stack-outputs.outputs.api_endpoint }}"

  rollback:
    name: Rollback Production
    runs-on: ubuntu-latest
    if: failure() && github.ref == 'refs/heads/main'
    needs: [deploy-production]
    environment: production
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Find latest backup and rollback
        run: |
          STATIC_BUCKET=$(aws cloudformation describe-stacks --stack-name EzCarRental-production --query 'Stacks[0].Outputs[?OutputKey==`StaticAssetsBucketName`].OutputValue' --output text)
          LATEST_PREFIX=$(aws s3api list-objects-v2 --bucket $STATIC_BUCKET --prefix "backup-" --delimiter "/" --query 'CommonPrefixes[-1].Prefix' --output text 2>/dev/null || echo "")
          if [ -z "$LATEST_PREFIX" ] || [ "$LATEST_PREFIX" = "None" ]; then
            echo "No backup found to rollback to"
            exit 1
          fi
          echo "Rolling back from: $LATEST_PREFIX"
          aws s3 sync "s3://$STATIC_BUCKET/$LATEST_PREFIX" "s3://$STATIC_BUCKET/" --delete --exclude "backup-*"

      - name: Verify rollback
        run: |
          API_ENDPOINT=$(aws cloudformation describe-stacks --stack-name EzCarRental-production --query 'Stacks[0].Outputs[?OutputKey==`ApiEndpoint`].OutputValue' --output text)
          curl -f $API_ENDPOINT || echo "API still failing after rollback"
